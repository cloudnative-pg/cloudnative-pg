# permissions for automation (CI/CD, GitOps controllers, platform tooling) to
# edit the namespaced CloudNativePG resources, without cluster-admin.
# Bind it with a RoleBinding to limit it to a single namespace.
#
# It deliberately does NOT include the resources whose write access is close to
# PostgreSQL superuser access, so that they can be granted separately:
# - DatabaseRole: see databaserole-editor-role. Write access to Cluster can
#   also set superuser and inRoles through inline managed roles
#   (spec.managed.roles), as long as they are supported.
# - Pooler: see pooler-editor-role (authQuery runs arbitrary SQL)
# It also excludes ClusterImageCatalog (cluster-scoped, needs a
# ClusterRoleBinding, see clusterimagecatalog-editor-role) and FailoverQuorum
# (written by the operator, read-only for users).
# Write access to Cluster is itself a high-privilege grant, see "RBAC on Custom
# Resources" in the documentation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
  name: editor-role
rules:
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups
  - clusters
  - databases
  - imagecatalogs
  - publications
  - scheduledbackups
  - subscriptions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# kubectl cnpg promote patches the status subresource of the Cluster.
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - clusters/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - postgresql.cnpg.io
  resources:
  - backups/status
  - databases/status
  - imagecatalogs/status
  - publications/status
  - scheduledbackups/status
  - subscriptions/status
  verbs:
  - get
