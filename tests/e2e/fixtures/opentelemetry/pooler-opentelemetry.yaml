apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pooler-opentelemetry
spec:
  cluster:
    name: cluster-opentelemetry

  instances: 1
  type: rw
  pgbouncer:
    poolMode: session

  # PgBouncer exports its logs via HTTP, the default protocol, to the
  # collector in the same namespace, identified by the pod name
  template:
    spec:
      containers:
      - name: pgbouncer
        env:
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
          value: http://otel-collector:4318/v1/logs
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.pod.name=$(K8S_POD_NAME)
