# Verify if a pull request contains the labels required to enable the merge button.
name: require-labels

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions: read-all

jobs:
  require-labels:
    name: Require labels
    runs-on: ubuntu-24.04
    steps:
      - name: Require labels
        uses: agilepathway/label-checker@c324842522fbd012e4f590afe3b4e591301322ed # v1.6.66
        with:
          any_of: "ok to merge :ok_hand:"
          none_of: "do not merge"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
