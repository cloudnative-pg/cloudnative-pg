# Verify if a pull request contains the labels required to enable the merge button.
name: require-labels

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions: {}

jobs:
  require-labels:
    name: Require labels
    runs-on: ubuntu-24.04
    steps:
      - name: Require labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const labels = (context.payload.pull_request.labels || []).map((l) => l.name);
            if (!labels.includes('ok to merge :ok_hand:')) {
              core.setFailed('Missing required label: "ok to merge :ok_hand:"');
            }
            if (labels.includes('do not merge :no_good:')) {
              core.setFailed('Forbidden label present: "do not merge :no_good:"');
            }
